name: Tests and coverage on push
on:
  # Haybarn: upstream auto-triggers removed so this workflow
  # does not run on the fork. Still runnable manually if needed.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_quality:
    name: Code-quality checks
    uses: ./.github/workflows/code_quality.yml

  test:
    name: Run coverage tests
    needs: code_quality
    uses: ./.github/workflows/coverage.yml
    with:
      git_ref: ${{ github.ref }}
      testsuite: fast
