name: Tests and builds on PR
on:
  # Haybarn: upstream auto-triggers removed so this workflow
  # does not run on the fork. Still runnable manually if needed.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_quality:
    name: Code-quality checks
    uses: ./.github/workflows/code_quality.yml

  packaging_test:
    name: Build a minimal set of packages and run all tests on them
    needs: code_quality
    # Skip packaging tests for draft PRs
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    uses: ./.github/workflows/packaging.yml
    with:
      minimal: true
      testsuite: all

  coverage_test:
    name: Run coverage tests
    needs: code_quality
    # Only run coverage test for draft PRs
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
    uses: ./.github/workflows/coverage.yml
    with:
      testsuite: all
