# Haybarn: builds and publishes the `haybarn` Python package (wheels + sdist).
# Self-contained; does not reuse the upstream DuckDB-python release plumbing.
#
# The DuckDB engine is built from the `external/duckdb` submodule, which points
# at the Haybarn core fork (Query-farm-haybarn/haybarn) — so the wheels embed
# the Haybarn build of DuckDB (Haybarn extension trust root, etc.).
name: Haybarn Python

on:
  push:
    tags:
      - 'haybarn-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Where to publish: "pypi", "testpypi", or empty for none'
        type: string

concurrency:
  group: haybarn-python-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the package version. duckdb_packaging' versioning reads OVERRIDE_GIT_DESCRIBE
  # and turns it into the PEP 440 version; without it setuptools_scm can't derive
  # a version from the `haybarn` branch (no version tag at HEAD) and falls back to
  # the invalid `0.0.1.dev1`.
  OVERRIDE_GIT_DESCRIBE: v1.5.2
  # Haybarn-specific version string baked into the engine via CMakeLists.txt.
  # On tag push this is "haybarn-v1.5.2-rc1" etc.; on workflow_dispatch it's
  # empty, and CMake falls back to deriving via `git describe --match haybarn-v*`.
  HAYBARN_GIT_DESCRIBE: ${{ startsWith(github.ref, 'refs/tags/haybarn-v') && github.ref_name || '' }}

jobs:
  wheels:
    name: Wheels ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # pyproject.toml's cibuildwheel config uses build-frontend "build[uv]";
      # the native (macOS/Windows) builds need `uv` on PATH. (Linux builds run
      # in the manylinux container where cibuildwheel installs it itself.)
      - uses: astral-sh/setup-uv@v7

      # Persist ccache across runs. pyproject.toml's cibuildwheel `before-build`
      # installs ccache; DuckDB's CMake auto-detects it. CCACHE_DIR is pointed
      # at .ccache in the workspace — which is /project/.ccache inside the Linux
      # build container and $GITHUB_WORKSPACE/.ccache for native macOS builds.
      - name: ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-python-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            ccache-python-${{ matrix.os }}-

      # The wheel matrix (CIBW_*) is configured in pyproject.toml
      # [tool.cibuildwheel]. Platform-specific CIBW_ENVIRONMENT overrides the
      # generic one, so OVERRIDE_GIT_DESCRIBE is repeated where set.
      #
      # cibuildwheel @v3 dropped support for cp38 entirely (EOL Oct 2024) and
      # changed host-environment introspection from a hardcoded
      # `/opt/python/cp38-cp38/bin/python` to the runner's own Python. The
      # rolled-forward manylinux_2_28:2026.05.13-1 image no longer ships cp38,
      # so @v2.21's hardcoded path exits 127 before the wheel build starts.
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # CCACHE_REMOTE_STORAGE points at the Haybarn Cloudflare Worker → R2
          # bucket (same auth/path-prefix as the extension builds). Defined as
          # a job-level env var here so it's a single source of truth across
          # the per-platform CIBW_ENVIRONMENT_* strings below, which forward
          # it into the manylinux container / macOS shell / Windows shell.
          CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"
          CCACHE_SLOPPINESS: "time_macros,include_file_mtime,pch_defines"
          CCACHE_COMPILERCHECK: "content"
          CCACHE_NOHASHDIR: "1"
          # cibuildwheel forwards env vars to the wheel-build subprocess only
          # when listed in CIBW_ENVIRONMENT_*; PASS_THROUGH avoids hand-listing
          # each.
          CIBW_ENVIRONMENT_PASS_LINUX: 'CCACHE_REMOTE_STORAGE CCACHE_SLOPPINESS CCACHE_COMPILERCHECK CCACHE_NOHASHDIR HAYBARN_GIT_DESCRIBE'
          CIBW_ENVIRONMENT: 'OVERRIDE_GIT_DESCRIBE=v1.5.2'
          # CCACHE_BASEDIR has to be a path *inside* the container/shell that
          # ccache will see — cibuildwheel mounts the workspace at /project on
          # Linux, but uses $GITHUB_WORKSPACE on native shells.
          # HAYBARN_GIT_DESCRIBE gets baked in as HAYBARN_VERSION_STRING by CMake.
          CIBW_ENVIRONMENT_LINUX: 'OVERRIDE_GIT_DESCRIBE=v1.5.2 CCACHE_DIR=/project/.ccache CCACHE_BASEDIR=/project'
          CIBW_ENVIRONMENT_MACOS: 'OVERRIDE_GIT_DESCRIBE=v1.5.2 HAYBARN_GIT_DESCRIBE=$HAYBARN_GIT_DESCRIBE CCACHE_DIR=$GITHUB_WORKSPACE/.ccache CCACHE_BASEDIR=$GITHUB_WORKSPACE'
          # Windows: point CCACHE_DIR at the workspace `.ccache` dir so the
          # actions/cache step above persists it. Without this, ccache writes
          # to its default user-profile location which our cache never sees.
          CIBW_ENVIRONMENT_WINDOWS: 'OVERRIDE_GIT_DESCRIBE=v1.5.2 HAYBARN_GIT_DESCRIBE=%HAYBARN_GIT_DESCRIBE% CCACHE_DIR=$GITHUB_WORKSPACE\\.ccache CCACHE_BASEDIR=$GITHUB_WORKSPACE'

      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist .
      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    if: ${{ inputs.publish == 'pypi' || inputs.publish == 'testpypi' }}
    runs-on: ubuntu-24.04
    # PyPI Trusted Publishing (OIDC) — no PYPI_API_TOKEN secret needed. Requires
    # a pending/registered publisher on (Test)PyPI for owner Query-farm-haybarn,
    # repo haybarn-python, workflow haybarn-python.yml.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: haybarn-*
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
