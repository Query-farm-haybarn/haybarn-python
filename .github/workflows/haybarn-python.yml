# Haybarn: builds and publishes the `haybarn` Python package (wheels + sdist).
# Self-contained; does not reuse the upstream DuckDB-python release plumbing.
#
# The DuckDB engine is built from the `external/duckdb` submodule, which points
# at the Haybarn core fork (Query-farm-haybarn/haybarn) — so the wheels embed
# the Haybarn build of DuckDB (Haybarn extension trust root, etc.).
name: Haybarn Python

on:
  push:
    tags:
      - 'haybarn-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Where to publish: "pypi" (default), "testpypi", or "none" to skip'
        type: string
        default: 'pypi'

concurrency:
  group: haybarn-python-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the upstream (DuckDB) version used for storage/extension compatibility.
  # duckdb_packaging' versioning reads OVERRIDE_GIT_DESCRIBE and turns it into a
  # PEP 440 string; without it setuptools_scm can't derive a version from the
  # `haybarn` branch (no `v…` tag at HEAD) and falls back to `0.0.1.dev1`.
  # OVERRIDE_GIT_DESCRIBE is only consulted by forced_version_from_env() if
  # HAYBARN_GIT_DESCRIBE is unset, so HAYBARN_GIT_DESCRIBE (derived per-job
  # in the `derive-version` job below) wins for the wheel name.
  OVERRIDE_GIT_DESCRIBE: v1.5.5

jobs:
  # Compute HAYBARN_GIT_DESCRIBE once and fan it out to every build job. We
  # can't put this in workflow-level `env:` because for non-tag triggers the
  # value has to come from `git describe` on the submodule, which needs the
  # repo checked out — workflow-level env evaluation happens before any
  # steps run.
  derive-version:
    name: Derive Haybarn version
    runs-on: ubuntu-24.04
    outputs:
      haybarn_describe: ${{ steps.derive.outputs.haybarn_describe }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - id: derive
        # On tag push (refs/tags/haybarn-v…), use the tag name verbatim so the
        # version is fully reproducible from the tag. Otherwise ask the engine
        # submodule for its `git describe --match haybarn-v*` — e.g.
        # `haybarn-v1.5.5-rc1-34-g111577c34c`. `--always` so even a missing tag
        # falls back to a bare sha rather than empty (in which case the
        # setuptools_scm parser will reject it loudly, surfacing the bad state).
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/haybarn-v* ]]; then
            describe="${GITHUB_REF_NAME}"
          else
            describe="$(git -C external/duckdb describe --tags --match 'haybarn-v*' --always)"
          fi
          echo "haybarn_describe=${describe}" >> "$GITHUB_OUTPUT"
          echo "Derived HAYBARN_GIT_DESCRIBE=${describe}"
  wheels:
    name: Wheels ${{ matrix.os }} / ${{ matrix.python }}
    needs: derive-version
    env:
      # Consumed by duckdb_packaging.setuptools_scm_version.forced_version_from_env
      # (strips the `haybarn-` prefix and runs it through the override parser)
      # and baked into the engine as HAYBARN_VERSION_STRING via CMake.
      HAYBARN_GIT_DESCRIBE: ${{ needs.derive-version.outputs.haybarn_describe }}
    strategy:
      fail-fast: false
      # Two-dimensional matrix: 4 OSes × 5 Python versions = 20 parallel jobs,
      # one wheel build each (Linux jobs build both manylinux + musllinux for
      # the chosen Python ABI in the same container — splitting those further
      # would double the manylinux pull overhead without much wall-clock win).
      # cibuildwheel iterates CIBW_BUILD patterns *serially* within a single
      # job, so keeping the old single-job-per-OS layout meant ~5× redundant
      # serialization of 2000-TU engine compiles. With the matrix expansion
      # the slowest job is one Python ABI's build (~10–15 min) instead of the
      # full 5-ABI sweep (~2 h on Linux-arm).
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022, windows-11-arm]
        python: [cp310, cp311, cp312, cp313, cp314]
        exclude:
          # cp310 on Windows ARM64: too many test dependencies (pyarrow, torch,
          # tensorflow, adbc, gcsfs, fsspec) lack ARM64 wheels for 3.10.
          # Pyproject.toml's resolution environment requires Python >=3.11 for
          # win32+ARM64 anyway, so cp310 ARM64 isn't supported.
          - { os: windows-11-arm, python: cp310 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # pyproject.toml's cibuildwheel config uses build-frontend "build[uv]";
      # the native (macOS/Windows) builds need `uv` on PATH. (Linux builds run
      # in the manylinux container where cibuildwheel installs it itself.)
      - uses: astral-sh/setup-uv@v7

      # Persist ccache across runs. pyproject.toml's cibuildwheel `before-build`
      # installs ccache; DuckDB's CMake auto-detects it.
      #
      # Critical detail (took multiple runs to surface): cibuildwheel COPIES
      # the project into the manylinux container as `/project` rather than
      # bind-mounting it. So a path inside the container only persists if it
      # was an *explicit* bind mount. The previous `CCACHE_DIR=/project/.ccache`
      # wrote into the container's ephemeral filesystem, was destroyed when
      # the container exited, and `actions/cache` then logged "Path(s)
      # specified in the action for caching do(es) not exist" because the
      # host's `.ccache` was never touched.
      #
      # Fix: bind-mount $GITHUB_WORKSPACE/.ccache into the container at /ccache
      # via CIBW_CONTAINER_ENGINE create_args, and point CCACHE_DIR at /ccache.
      # The bind mount survives the container teardown; the host sees the
      # written objects; actions/cache picks them up.
      #
      # Per-(os, python) cache key so the 20 matrix legs don't race each other
      # writing the same key on completion. The R2 remote-storage layer is
      # content-addressed by ccache hash (which already incorporates the Python
      # ABI through preprocessor defines), so cross-leg hits still come through
      # the remote — the local cache is a warm-start optimization for within-leg.
      - name: Prep ccache dir
        # Pre-create the directory so the docker bind mount finds an existing
        # path on the host. Without this, docker creates it as root, which the
        # subsequent actions/cache 'save' step then can't read.
        shell: bash
        run: mkdir -p .ccache
      - name: ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-python-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          restore-keys: |
            ccache-python-${{ matrix.os }}-${{ matrix.python }}-
            ccache-python-${{ matrix.os }}-

      # The wheel matrix (CIBW_*) is configured in pyproject.toml
      # [tool.cibuildwheel]. Platform-specific CIBW_ENVIRONMENT overrides the
      # generic one, so OVERRIDE_GIT_DESCRIBE is repeated where set.
      #
      # cibuildwheel @v3 dropped support for cp38 entirely (EOL Oct 2024) and
      # changed host-environment introspection from a hardcoded
      # `/opt/python/cp38-cp38/bin/python` to the runner's own Python. The
      # rolled-forward manylinux_2_28:2026.05.13-1 image no longer ships cp38,
      # so @v2.21's hardcoded path exits 127 before the wheel build starts.
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # Scope this matrix leg to a single Python ABI. Overrides the
          # `build = "cp310-* cp311-* cp312-* cp313-* cp314-*"` pattern in
          # pyproject.toml so we don't reserialize all five within one job.
          # Pattern still matches both manylinux + musllinux on Linux.
          CIBW_BUILD: "${{ matrix.python }}-*"
          # CCACHE_REMOTE_STORAGE points at the Haybarn Cloudflare Worker → R2
          # bucket (same auth/path-prefix as the extension builds). Defined as
          # a job-level env var here so it's a single source of truth across
          # the per-platform CIBW_ENVIRONMENT_* strings below, which forward
          # it into the manylinux container / macOS shell / Windows shell.
          CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"
          CCACHE_SLOPPINESS: "time_macros,include_file_mtime,pch_defines"
          CCACHE_COMPILERCHECK: "content"
          CCACHE_NOHASHDIR: "1"
          # cibuildwheel forwards env vars to the wheel-build subprocess only
          # when listed in CIBW_ENVIRONMENT_*; PASS_THROUGH avoids hand-listing
          # each.
          CIBW_ENVIRONMENT_PASS_LINUX: 'CCACHE_REMOTE_STORAGE CCACHE_SLOPPINESS CCACHE_COMPILERCHECK CCACHE_NOHASHDIR HAYBARN_GIT_DESCRIBE'
          CIBW_ENVIRONMENT: 'OVERRIDE_GIT_DESCRIBE=v1.5.5'
          # Bind-mount the host's .ccache into the container at /ccache so
          # ccache writes survive container destruction. Without this,
          # cibuildwheel's project-copy semantics (NOT bind mount) cause
          # CCACHE_DIR to live in the container's ephemeral layer.
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume ${{ github.workspace }}/.ccache:/ccache"
          # CCACHE_BASEDIR is /project (where cibuildwheel deposits the source
          # tree inside the container); it normalizes paths in ccache hashes
          # so two different absolute prefixes still hit the same key.
          # CCACHE_DIR points at the bind-mounted /ccache (= host .ccache).
          CIBW_ENVIRONMENT_LINUX: 'OVERRIDE_GIT_DESCRIBE=v1.5.5 CCACHE_DIR=/ccache CCACHE_BASEDIR=/project'
          CIBW_ENVIRONMENT_MACOS: 'OVERRIDE_GIT_DESCRIBE=v1.5.5 HAYBARN_GIT_DESCRIBE=$HAYBARN_GIT_DESCRIBE CCACHE_DIR=$GITHUB_WORKSPACE/.ccache CCACHE_BASEDIR=$GITHUB_WORKSPACE'
          # Windows: point CCACHE_DIR at the workspace `.ccache` dir so the
          # actions/cache step above persists it. Without this, ccache writes
          # to its default user-profile location which our cache never sees.
          # scikit-build-core's CMake invocation needs CMAKE_*_COMPILER_LAUNCHER
          # explicitly set; ccache 4.6+ handles MSVC (`cl.exe`) natively. The
          # other ccache_* tuning vars also need to be re-listed here because
          # `CIBW_ENVIRONMENT_PASS_LINUX` only forwards into the Linux container.
          # cibuildwheel parses CIBW_ENVIRONMENT_* with POSIX-shell-style
          # expansion regardless of host OS, so `$VAR` works on Windows too.
          # The previous %HAYBARN_GIT_DESCRIBE% (cmd-style) reached the build
          # backend as a literal string and triggered:
          #     ValueError: Invalid git describe override: %HAYBARN_GIT_DESCRIBE%
          CIBW_ENVIRONMENT_WINDOWS: 'OVERRIDE_GIT_DESCRIBE=v1.5.5 HAYBARN_GIT_DESCRIBE=$HAYBARN_GIT_DESCRIBE CCACHE_DIR=$GITHUB_WORKSPACE\\.ccache CCACHE_BASEDIR=$GITHUB_WORKSPACE CCACHE_NOHASHDIR=1 CCACHE_SLOPPINESS=time_macros,include_file_mtime,pch_defines CCACHE_COMPILERCHECK=content CCACHE_COMPILERTYPE=msvc CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache CCACHE_REMOTE_STORAGE=$CCACHE_REMOTE_STORAGE'

      # Linux only: the container wrote .ccache as root via the bind mount,
      # so the actions/cache save step (running as the `runner` user) can't
      # tar it up. Re-own to the runner user. Runs always so a failed build
      # still gives us a populated cache to learn from.
      - name: Reclaim ccache ownership
        if: ${{ runner.os == 'Linux' && always() }}
        shell: bash
        run: |
          if [ -d .ccache ]; then
            sudo chown -R "$(id -u):$(id -g)" .ccache
            echo "ccache size: $(du -sh .ccache 2>/dev/null | cut -f1)"
            ls -la .ccache | head -5 || true
          else
            echo "no .ccache dir to chown"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-wheels-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    needs: derive-version
    runs-on: ubuntu-24.04
    env:
      HAYBARN_GIT_DESCRIBE: ${{ needs.derive-version.outputs.haybarn_describe }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist .
      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    # Publish to PyPI by default. Tag pushes (no `inputs`) and dispatches that
    # leave the default in place both land here; only an explicit "none" skips,
    # and "testpypi" redirects the upload below.
    if: ${{ inputs.publish != 'none' }}
    runs-on: ubuntu-24.04
    # PyPI Trusted Publishing (OIDC) — no PYPI_API_TOKEN secret needed. Requires
    # a pending/registered publisher on (Test)PyPI for owner Query-farm-haybarn,
    # repo haybarn-python, workflow haybarn-python.yml.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: haybarn-*
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
